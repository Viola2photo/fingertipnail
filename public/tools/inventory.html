<body class="bg-[#F8F9FA] text-gray-800 font-sans selection:bg-blue-100">
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyDQZGeeubB8bEUL59v9yt0QBAfIWJcvgnw",
      authDomain: "nailproject-40022.firebaseapp.com",
      projectId: "nailproject-40022",
      storageBucket: "nailproject-40022.firebasestorage.app",
      messagingSenderId: "1004628981925",
      appId: "1:1004628981925:web:db01ede0c09f4071d5754c"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage(); 
    const functions = firebase.app().functions('asia-east1');
    const appId = 'nail-inventory-app';
    const adminUserId = "MvkJo5e1kEcBS0fGGMr4RKdQjYg1";

    const { useState, useRef, useEffect, useMemo } = React;

    const NAIL_SHAPES = ['短橢圓', '中橢圓', '長橢圓', '細狗尖', '杏仁甲', '短圓', '新中方', '短梯', '中梯', '長梯', '超長梯', '長水滴'];

    const Toast = ({ message, type, onClose }) => {
      useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
      const bgColor = type === 'success' ? 'bg-gray-900' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
      return (
        <div className={`fixed bottom-24 md:bottom-10 left-1/2 transform -translate-x-1/2 w-[90%] md:w-auto max-w-sm ${bgColor} text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-[150] border border-white/10 animate-bounce-short text-center`}>
          <span className="font-bold text-sm tracking-wide">{message}</span>
        </div>
      );
    };

    const compressImage = (file, maxResolution = 800) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let { width, height } = img;
            if (width > height && width > maxResolution) { height *= maxResolution / width; width = maxResolution; } 
            else if (height > maxResolution) { width *= maxResolution / height; height = maxResolution; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    // 提取圖片特徵：平均RGB值和形狀
    const extractImageFeatures = (base64String) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;
          let r = 0, g = 0, b = 0;
          const pixelCount = data.length / 4;
          for (let i = 0; i < data.length; i += 4) {
            r += data[i];
            g += data[i + 1];
            b += data[i + 2];
          }
          r = Math.round(r / pixelCount);
          g = Math.round(g / pixelCount);
          b = Math.round(b / pixelCount);
          const aspectRatio = canvas.width / canvas.height;
          resolve({ r, g, b, aspectRatio });
        };
        img.src = base64String;
      });
    };

    const uploadBase64ToStorage = async (base64String, fileNamePrefix) => {
      const storageRef = storage.ref();
      const fileName = `products/${Date.now()}_${fileNamePrefix}_${Math.random().toString(36).substr(2, 5)}.jpg`;
      const fileRef = storageRef.child(fileName);
      const response = await fetch(base64String);
      const blob = await response.blob();
      await fileRef.put(blob);
      return await fileRef.getDownloadURL();
    };

    // 甲型過濾組件
    const ShapeFilter = ({ activeShape, onShapeSelect, className = "" }) => {
      return (
        <div className={`flex overflow-x-auto gap-2 pb-2 mb-4 [&::-webkit-scrollbar]:hidden scroll-smooth ${className}`}>
          <button 
            onClick={() => onShapeSelect('All')} 
            className={`whitespace-nowrap px-5 py-2 rounded-full font-black text-xs transition-all flex-shrink-0 border ${activeShape === 'All' ? 'bg-gray-900 text-white border-gray-900 shadow-md' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'}`}
          >
            全部款式
          </button>
          {NAIL_SHAPES.map(shape => (
            <button 
              key={shape} 
              onClick={() => onShapeSelect(shape)} 
              className={`whitespace-nowrap px-4 py-2 rounded-full font-black text-xs transition-all flex-shrink-0 border ${activeShape === shape ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'}`}
            >
              {shape}
            </button>
          ))}
        </div>
      );
    };

    // ========== 批次修改價格與各尺寸庫存 ==========
    const SIZES = ['XS', 'S', 'M', 'L'];
    const toCount = (v) => Math.max(0, parseInt(v, 10) || 0);

    // 把畫面上的修改整理成「要寫回資料庫的變更」；沒有實際改變的款式不列入
    const collectBatchChanges = (items, edits) => items.flatMap(item => {
      const e = edits[item.docId];
      if (!e) return [];
      const change = { item, price: null, stock: {} };
      if (e.price !== undefined && e.price !== '' && Number(e.price) > 0 && Number(e.price) !== Number(item.price)) change.price = Number(e.price);
      SIZES.forEach(s => {
        if (e.stock?.[s] === undefined || e.stock[s] === '') return;
        const after = toCount(e.stock[s]);
        if (after !== Number(item.stock?.[s] || 0)) change.stock[s] = after;
      });
      return change.price !== null || Object.keys(change.stock).length ? [change] : [];
    });

    const BatchEditor = ({ items, allItems, onClose, showToast }) => {
      const [edits, setEdits] = useState({});
      const [selected, setSelected] = useState({});
      const [bulkPrice, setBulkPrice] = useState('');
      const [bulkSize, setBulkSize] = useState('ALL');
      const [bulkMode, setBulkMode] = useState('set');
      const [bulkQty, setBulkQty] = useState('');
      const [saving, setSaving] = useState(false);

      const shopRoot = db.collection('artifacts').doc(appId).collection('users').doc(adminUserId);
      const selectedItems = items.filter(i => selected[i.docId]);
      const allSelected = items.length > 0 && selectedItems.length === items.length;
      // 用全部款式計算，切換甲型分類時，其他分類改過的也會一起儲存
      const changes = useMemo(() => collectBatchChanges(allItems, edits), [allItems, edits]);

      const priceOf = (item) => edits[item.docId]?.price ?? (item.price || '');
      const stockOf = (item, s) => edits[item.docId]?.stock?.[s] ?? (item.stock?.[s] || 0);
      const isChanged = (item, field, s) => {
        const c = changes.find(x => x.item.docId === item.docId);
        if (!c) return false;
        return field === 'price' ? c.price !== null : c.stock[s] !== undefined;
      };
      const setPrice = (item, value) => setEdits(prev => ({ ...prev, [item.docId]: { ...prev[item.docId], price: value } }));
      const setStock = (item, s, value) => setEdits(prev => ({ ...prev, [item.docId]: { ...prev[item.docId], stock: { ...prev[item.docId]?.stock, [s]: value } } }));

      const toggleAll = () => setSelected(allSelected ? {} : Object.fromEntries(items.map(i => [i.docId, true])));

      const applyBulkPrice = () => {
        const price = Number(bulkPrice);
        if (!(price > 0)) return showToast('請輸入正確的價格', 'error');
        if (!selectedItems.length) return showToast('請先勾選要修改的款式', 'error');
        setEdits(prev => {
          const next = { ...prev };
          selectedItems.forEach(i => { next[i.docId] = { ...next[i.docId], price }; });
          return next;
        });
        showToast(`已把 ${selectedItems.length} 款的價格改為 NT$${price}（尚未儲存）`, 'info');
      };

      const applyBulkStock = () => {
        if (bulkQty === '' || isNaN(Number(bulkQty))) return showToast('請輸入數量', 'error');
        if (!selectedItems.length) return showToast('請先勾選要修改的款式', 'error');
        const qty = toCount(bulkQty);
        const sizes = bulkSize === 'ALL' ? SIZES : [bulkSize];
        setEdits(prev => {
          const next = { ...prev };
          selectedItems.forEach(i => {
            const stock = { ...next[i.docId]?.stock };
            sizes.forEach(s => {
              const current = toCount(stock[s] ?? i.stock?.[s]);
              stock[s] = bulkMode === 'set' ? qty : bulkMode === 'add' ? current + qty : Math.max(0, current - qty);
            });
            next[i.docId] = { ...next[i.docId], stock };
          });
          return next;
        });
        const sizeText = bulkSize === 'ALL' ? '全部尺寸' : bulkSize;
        const modeText = bulkMode === 'set' ? `設為 ${qty}` : bulkMode === 'add' ? `增加 ${qty}` : `減少 ${qty}`;
        showToast(`已把 ${selectedItems.length} 款的 ${sizeText} 庫存${modeText}（尚未儲存）`, 'info');
      };

      const handleSave = async () => {
        if (!changes.length) return showToast('沒有任何變更', 'error');
        if (!confirm(`確定要儲存 ${changes.length} 款的變更嗎？`)) return;
        setSaving(true);
        try {
          const now = new Date().toISOString();
          const by = auth.currentUser?.email || auth.currentUser?.uid || '';
          // 每款最多 5 筆寫入（商品＋4 個尺寸的異動紀錄），一次交易最多 500 筆，所以 80 款一組
          for (let i = 0; i < changes.length; i += 80) {
            const group = changes.slice(i, i + 80);
            await db.runTransaction(async (tx) => {
              const refs = group.map(c => shopRoot.collection('inventory').doc(c.item.docId));
              const snaps = await Promise.all(refs.map(ref => tx.get(ref)));
              group.forEach((c, idx) => {
                if (!snaps[idx].exists) return;
                const data = snaps[idx].data();
                const stock = { ...(data.stock || {}) };
                const patch = {};
                Object.entries(c.stock).forEach(([s, after]) => {
                  const before = Number(stock[s] || 0);
                  if (before === after) return;
                  stock[s] = after;
                  tx.set(shopRoot.collection('stockMovements').doc(), { type: 'adjust', productId: c.item.docId, name: data.name || '', size: s, quantity: after - before, before, after, unitCost: null, at: now, note: '批次修改', by });
                });
                if (Object.keys(c.stock).length) patch.stock = stock;
                if (c.price !== null) patch.price = c.price;
                if (Object.keys(patch).length) tx.update(refs[idx], patch);
              });
            });
          }
          showToast(`已儲存 ${changes.length} 款的變更`, 'success');
          setEdits({});
          setSelected({});
        } catch (error) {
          console.error(error);
          showToast('儲存失敗，請重試', 'error');
        } finally {
          setSaving(false);
        }
      };

      const handleClose = () => {
        if (changes.length && !confirm('還有修改沒有儲存，確定要離開嗎？')) return;
        onClose();
      };

      const cellClass = (changed) => `w-full text-center py-2 rounded-xl font-black text-sm outline-none border ${changed ? 'bg-yellow-50 border-yellow-300 text-yellow-800' : 'bg-gray-50 border-transparent focus:border-blue-200'}`;

      return (
        <div className="pb-40 md:pb-24">
          <div className="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 mb-4 space-y-4">
            <div className="flex items-center justify-between gap-2">
              <div>
                <h2 className="font-black text-base">✏️ 批次修改價格／庫存</h2>
                <p className="text-xs text-gray-400 font-bold mt-1">可直接在下方每一款改數字，或勾選多款後一次套用。改過的格子會變黃色，按「儲存」才會更新到網站。</p>
              </div>
              <button onClick={handleClose} className="flex-shrink-0 bg-gray-100 text-gray-600 px-4 py-2 rounded-full font-black text-xs hover:bg-gray-200">離開</button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div className="bg-gray-50 p-4 rounded-2xl min-w-0">
                <p className="text-xs font-black text-gray-500 mb-2">💰 已勾選的款式：價格改為</p>
                <div className="flex gap-2">
                  <input type="number" min="1" inputMode="numeric" placeholder="例如 390" value={bulkPrice} onChange={e => setBulkPrice(e.target.value)} className="flex-1 min-w-0 bg-white p-3 rounded-xl font-black text-sm outline-none border border-gray-200 focus:border-blue-300" />
                  <button onClick={applyBulkPrice} className="bg-gray-900 text-white px-4 rounded-xl font-black text-xs whitespace-nowrap hover:bg-black">套用</button>
                </div>
              </div>
              <div className="bg-gray-50 p-4 rounded-2xl min-w-0">
                <p className="text-xs font-black text-gray-500 mb-2">📦 已勾選的款式：庫存</p>
                <div className="grid grid-cols-[1fr_1fr_1fr_auto] gap-2">
                  <select aria-label="尺寸" value={bulkSize} onChange={e => setBulkSize(e.target.value)} className="min-w-0 bg-white px-1 py-3 rounded-xl font-black text-sm border border-gray-200">
                    <option value="ALL">全部尺寸</option>
                    {SIZES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <select aria-label="方式" value={bulkMode} onChange={e => setBulkMode(e.target.value)} className="min-w-0 bg-white px-1 py-3 rounded-xl font-black text-sm border border-gray-200">
                    <option value="set">設為</option>
                    <option value="add">增加</option>
                    <option value="sub">減少</option>
                  </select>
                  <input type="number" min="0" inputMode="numeric" placeholder="數量" value={bulkQty} onChange={e => setBulkQty(e.target.value)} className="min-w-0 bg-white p-3 rounded-xl font-black text-sm outline-none border border-gray-200 focus:border-blue-300" />
                  <button onClick={applyBulkStock} className="bg-gray-900 text-white px-4 rounded-xl font-black text-xs whitespace-nowrap hover:bg-black">套用</button>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden">
            <div className="flex items-center gap-3 px-4 py-3 border-b border-gray-100 bg-gray-50">
              <label className="flex items-center gap-2 text-xs font-black text-gray-600 cursor-pointer">
                <input type="checkbox" checked={allSelected} onChange={toggleAll} className="w-5 h-5 accent-blue-600" />
                全選（{selectedItems.length}/{items.length}）
              </label>
              <div className="ml-auto hidden md:grid grid-cols-5 gap-2 w-[22rem] text-[10px] font-black text-gray-400 text-center">
                <span>價格</span>{SIZES.map(s => <span key={s}>{s}</span>)}
              </div>
            </div>
            {items.map(item => (
              <div key={item.docId} className={`flex flex-col md:flex-row md:items-center gap-3 px-4 py-3 border-b border-gray-50 ${selected[item.docId] ? 'bg-blue-50/50' : ''}`}>
                <label className="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
                  <input type="checkbox" checked={!!selected[item.docId]} onChange={() => setSelected(prev => ({ ...prev, [item.docId]: !prev[item.docId] }))} className="w-5 h-5 accent-blue-600 flex-shrink-0" />
                  {item.media?.[0] ? <img src={item.media[0].url} className="w-12 h-12 rounded-xl object-cover flex-shrink-0" /> : <div className="w-12 h-12 rounded-xl bg-gray-100 flex-shrink-0" />}
                  <div className="min-w-0">
                    <p className="font-black text-sm truncate">{item.name || '未命名'}</p>
                    <p className="text-[10px] font-black text-gray-400">{item.id}{item.shape ? ` ・ ${item.shape}` : ''}</p>
                  </div>
                </label>
                <div className="grid grid-cols-5 gap-2 md:w-[22rem] flex-shrink-0">
                  {['價格', ...SIZES].map(t => <span key={t} className="text-[10px] font-black text-gray-400 text-center md:hidden">{t}</span>)}
                  <input type="number" min="1" inputMode="numeric" aria-label={`${item.name} 價格`} value={priceOf(item)} onChange={e => setPrice(item, e.target.value)} className={cellClass(isChanged(item, 'price'))} />
                  {SIZES.map(s => (
                    <input key={s} type="number" min="0" inputMode="numeric" aria-label={`${item.name} ${s} 庫存`} value={stockOf(item, s)} onChange={e => setStock(item, s, e.target.value)} className={cellClass(isChanged(item, 'stock', s))} />
                  ))}
                </div>
              </div>
            ))}
            {items.length === 0 && <p className="py-16 text-center font-black text-gray-400">此分類目前沒有款式</p>}
          </div>

          <div className="fixed left-0 right-0 bottom-20 md:bottom-0 z-30 px-4 pb-4 pointer-events-none">
            <div className="max-w-2xl mx-auto bg-gray-900 text-white rounded-2xl shadow-2xl p-3 flex items-center gap-3 pointer-events-auto">
              <span className="flex-1 text-xs font-black pl-2">{changes.length ? `${changes.length} 款有修改，尚未儲存` : '目前沒有修改'}</span>
              {changes.length > 0 && <button onClick={() => setEdits({})} disabled={saving} className="text-xs font-black text-gray-300 hover:text-white px-3 py-2">全部還原</button>}
              <button onClick={handleSave} disabled={saving || !changes.length} className="bg-green-500 disabled:bg-gray-600 text-white px-5 py-3 rounded-xl font-black text-sm hover:bg-green-600">{saving ? '儲存中…' : '💾 儲存'}</button>
            </div>
          </div>
        </div>
      );
    };

    function App() {
      const [activeTab, setActiveTab] = useState('inventory');
      const [inventory, setInventory] = useState([]);
      const [toastMsg, setToastMsg] = useState(null);
      const [isLoadingDB, setIsLoadingDB] = useState(true);
      const [user, setUser] = useState(null);

      const [drafts, setDrafts] = useState([]); 
      const csvInputRef = useRef(null);
      const draftPhotoInputRef = useRef({}); 
      
      const [editingItem, setEditingItem] = useState(null);
      const editMediaRef = useRef(null);
      
      // 款式庫分類過濾
      const [inventoryShapeFilter, setInventoryShapeFilter] = useState('All');
      const [batchMode, setBatchMode] = useState(false);
      
      // 匯出報表相關狀態
      const [showExportModal, setShowExportModal] = useState(false);
      const [exportDateRange, setExportDateRange] = useState({ start: '', end: '' });
      
      // 盤點相關狀態
      const [scanQuery, setScanQuery] = useState('');
      const [scanShapeFilter, setScanShapeFilter] = useState('All');
      const [scanModalItem, setScanModalItem] = useState(null);
      const [scanModalStock, setScanModalStock] = useState({ XS: 0, S: 0, M: 0, L: 0 });
      const [pendingScans, setPendingScans] = useState({});

      // 識別款式相關狀態
      const [recognizeImage, setRecognizeImage] = useState(null);
      const [recognizedItem, setRecognizedItem] = useState(null);
      const [isRecognizing, setIsRecognizing] = useState(false);

      const showToast = (message, type = 'success') => setToastMsg({ message, type });

      const getNextStandardId = (currentInventory, offset = 0) => {
        const nailIds = currentInventory
          .map(item => {
            const match = item.id?.match(/NAIL_(\d+)/);
            return match ? parseInt(match[1]) : 0;
          })
          .filter(id => !isNaN(id));
        
        const maxId = nailIds.length > 0 ? Math.max(...nailIds) : 0;
        const nextId = maxId + 1 + offset;
        return `NAIL_${nextId.toString().padStart(4, '0')}`;
      };

      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((u) => {
          setUser(u);
          if (!u) setIsLoadingDB(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) { 
          setInventory([]);
          return; 
        }
        setIsLoadingDB(true);
        const inventoryRef = db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory');
        
        const unsubscribeDB = inventoryRef.onSnapshot((snapshot) => {
          const dbData = snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id }));
          dbData.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setInventory(dbData);
          setIsLoadingDB(false);
        }, (err) => {
          console.error("Firestore Error:", err);
          showToast("資料庫讀取失敗，請檢查權限", "error");
          setIsLoadingDB(false);
        });
        return () => unsubscribeDB();
      }, [user]);

      const handleManualAdd = () => {
        setActiveTab('upload');
        const nextId = getNextStandardId(inventory, drafts.length);
        const newDraft = {
          uid: `manual-${Date.now()}`,
          formData: {
            id: nextId,
            name: '',
            price: 390,
            description: '',
            shape: '',
            hashtags: '',
            stock: { XS: 0, S: 0, M: 0, L: 0 },
            media: []
          }
        };
        setDrafts([...drafts, newDraft]);
      };

      const handleCsvImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        Papa.parse(file, {
          header: true, skipEmptyLines: true,
          complete: (results) => {
            const rows = results.data;
            if (rows.length === 0) { showToast("CSV 檔案為空", "error"); return; }
            
            let currentOffset = drafts.length;
            const newDrafts = rows.map((row, index) => {
              const nextId = getNextStandardId(inventory, currentOffset++);
              return {
                uid: `csv-${Date.now()}-${index}`,
                formData: {
                  id: nextId,
                  name: row['款式名稱'] || row['名稱'] || '',
                  price: parseInt(row['價格']) || 390,
                  description: row['趨勢風格描述 (50字內)'] || row['描述'] || '',
                  shape: NAIL_SHAPES.includes(row['甲型']) ? row['甲型'] : '',
                  hashtags: row['流行熱搜標籤 (#)'] || row['標籤'] || '',
                  stock: {
                    XS: parseInt(row['XS']) || 0,
                    S: parseInt(row['S']) || 0,
                    M: parseInt(row['M']) || 0,
                    L: parseInt(row['L']) || 0
                  },
                  media: []
                }
              };
            });
            setDrafts(prev => [...prev, ...newDrafts]);
            showToast(`成功匯入 ${newDrafts.length} 筆草稿`);
            e.target.value = '';
          }
        });
      };

      const handleDraftPhotoSelect = async (uid, e) => {
        const files = e.target.files; if (!files.length) return;
        showToast("雲端上傳中，請稍候...", "info");
        
        try {
          const newMedia = await Promise.all(Array.from(files).map(async (f) => {
            const compressedBase64 = await compressImage(f, 800);
            const downloadUrl = await uploadBase64ToStorage(compressedBase64, 'draft');
            // 提取特徵
            const features = await extractImageFeatures(compressedBase64);
            return { id: Math.random().toString(36).substr(2, 9), url: downloadUrl, type: 'image', features };
          }));
          
          setDrafts(drafts.map(d => d.uid === uid ? { ...d, formData: { ...d.formData, media: [...d.formData.media, ...newMedia] } } : d));
          showToast("上傳成功！", "success");
        } catch (error) {
          console.error(error);
          showToast("圖片上傳失敗，請重試", "error");
        }
        e.target.value = '';
      };

      const updateDraft = (uid, field, value) => { 
        setDrafts(drafts.map(d => d.uid !== uid ? d : { ...d, formData: { ...d.formData, [field]: value } })); 
      };
      
      const handleSaveDrafts = async () => {
        if (!user) return showToast("請先登入", "error");
        if (drafts.length === 0) return;
        
        try {
          const batch = db.batch();
          for (const draft of drafts) {
            const features = draft.formData.media[0]?.features || null; // 使用第一張圖的特徵
            const docRef = db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory').doc(draft.formData.id);
            batch.set(docRef, { 
              ...draft.formData, 
              features,
              createdAt: new Date().toISOString() 
            });
          }
          await batch.commit();
          setDrafts([]); 
          setActiveTab('inventory');
          showToast('雲端同步成功！');
        } catch (e) { showToast('同步失敗，請重試', 'error'); }
      };

      const handleEditMediaUpload = async (e) => {
        const files = e.target.files; if (!files.length) return;
        showToast("雲端上傳中，請稍候...", "info");
        
        try {
          const newMediaPromises = Array.from(files).map(async (file) => {
            const compressedBase64 = await compressImage(file, 800);
            const downloadUrl = await uploadBase64ToStorage(compressedBase64, 'edit');
            return { id: Math.random().toString(36).substr(2, 9), type: 'image', url: downloadUrl };
          });
          const newMediaList = await Promise.all(newMediaPromises);
          
          setEditingItem(prev => ({ ...prev, media: [...(prev.media || []), ...newMediaList] }));
          showToast("上傳成功！", "success");
        } catch (error) {
          console.error(error);
          showToast("照片上傳失敗，請重試", "error");
        }
        e.target.value = '';
      };

      // 盤點相關處理函數
      const openScanModal = (item) => {
        setScanModalItem(item);
        setScanModalStock(pendingScans[item.id] || { ...item.stock });
      };

      const saveScanModal = () => {
        setPendingScans(prev => ({
          ...prev,
          [scanModalItem.id]: scanModalStock
        }));
        setScanModalItem(null);
        showToast(`已暫存 ${scanModalItem.id} 盤點數量`);
      };

      const submitBatchScans = async () => {
        const pendingIds = Object.keys(pendingScans);
        if (pendingIds.length === 0) return;
        
        try {
          const batch = db.batch();
          pendingIds.forEach(id => {
            const docRef = db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory').doc(id);
            batch.update(docRef, { stock: pendingScans[id] });
          });
          await batch.commit();
          setPendingScans({});
          showToast(`成功更新 ${pendingIds.length} 筆盤點資料至雲端！`, 'success');
        } catch (error) {
          console.error(error);
          showToast('批次上傳失敗，請重試', 'error');
        }
      };

      // 計算系統總庫存
      const systemTotalStock = useMemo(() => {
        return inventory.reduce((acc, item) => {
          acc.XS += (item.stock?.XS || 0);
          acc.S += (item.stock?.S || 0);
          acc.M += (item.stock?.M || 0);
          acc.L += (item.stock?.L || 0);
          return acc;
        }, { XS: 0, S: 0, M: 0, L: 0 });
      }, [inventory]);

      // 過濾後的庫存 (款式庫用)
      const displayInventory = useMemo(() => {
        return inventory.filter(i => inventoryShapeFilter === 'All' || i.shape === inventoryShapeFilter);
      }, [inventory, inventoryShapeFilter]);

      // 過濾後的盤點清單 (盤點用)
      const filteredScanInventory = useMemo(() => {
        return inventory.filter(i => {
          const matchQuery = (i.id || '').toLowerCase().includes(scanQuery.toLowerCase()) || 
                             (i.name || '').toLowerCase().includes(scanQuery.toLowerCase());
          const matchShape = scanShapeFilter === 'All' || i.shape === scanShapeFilter;
          return matchQuery && matchShape;
        });
      }, [inventory, scanQuery, scanShapeFilter]);

      // 識別款式處理函數
      const handleRecognizePhoto = async (file) => {
        setIsRecognizing(true);
        setRecognizedItem(null);
        try {
          const compressedBase64 = await compressImage(file, 800);
          setRecognizeImage(compressedBase64);
          
          // 提取上傳圖片的特徵
          const uploadFeatures = await extractImageFeatures(compressedBase64);
          
          // 使用 Firebase Function 提取標籤
          let visionLabels = [];
          try {
            visionLabels = await callVisionAPI(compressedBase64);
          } catch (error) {
            console.warn('Vision API 調用失敗，使用備用匹配:', error);
          }
          
          // 與資料庫匹配：比較顏色特徵、形狀、Vision標籤和文字
          let bestMatch = null;
          let minDistance = Infinity;
          for (const item of inventory) {
            let distance = 0;
            
            // 顏色和形狀距離
            if (item.features) {
              const dr = item.features.r - uploadFeatures.r;
              const dg = item.features.g - uploadFeatures.g;
              const db = item.features.b - uploadFeatures.b;
              const colorDistance = Math.sqrt(dr * dr + dg * dg + db * db);
              const shapeDistance = Math.abs(item.features.aspectRatio - uploadFeatures.aspectRatio) * 50;
              distance += colorDistance + shapeDistance;
            } else {
              distance += 100; // 沒有特徵的懲罰
            }
            
            // Vision API 標籤匹配
            if (visionLabels.length > 0) {
              const itemText = (item.hashtags || '').toLowerCase() + ' ' + (item.description || '').toLowerCase() + ' ' + (item.name || '').toLowerCase();
              const visionScore = visionLabels.reduce((acc, label) => acc + (itemText.includes(label) ? 1 : 0), 0);
              distance -= visionScore * 20; // 匹配標籤減少距離
            }
            
            // 備用文字匹配
            if (distance > 150) {
              const itemText = (item.hashtags || '').toLowerCase() + ' ' + (item.description || '').toLowerCase() + ' ' + (item.name || '').toLowerCase();
              const mockLabels = ['nail', 'art', 'beauty', 'fashion', 'design', 'style', 'color', 'pattern', 'glitter', 'matte', 'shiny'];
              const selectedLabels = mockLabels.filter(() => Math.random() > 0.3);
              const score = selectedLabels.reduce((acc, label) => acc + (itemText.includes(label) ? 1 : 0), 0);
              distance = score > 0 ? 150 - score * 15 : 300;
            }
            
            if (distance < minDistance) {
              minDistance = distance;
              bestMatch = item;
            }
          }
          
          // 如果最小距離小於閾值，認為匹配
          if (bestMatch && minDistance < 200) {
            setRecognizedItem(bestMatch);
            showToast(`識別成功！匹配款式：${bestMatch.name} (距離: ${minDistance.toFixed(2)})`, 'success');
          } else {
            showToast(`未找到匹配的款式，請手動建檔 (最近距離: ${minDistance.toFixed(2)})`, 'error');
          }
        } catch (error) {
          console.error(error);
          showToast('識別失敗，請重試', 'error');
        } finally {
          setIsRecognizing(false);
        }
      };

      // 調用 Firebase Function 進行圖像分析
      const callVisionAPI = async (base64Image) => {
        const analyzeImage = functions.httpsCallable('analyzeImage');
        const result = await analyzeImage({ imageBase64: base64Image });
        return result.data.labels;
      };

      // ========== 匯出符合商城匯入規範的 CSV (支援時間區間) ==========
      const handleExportCSV = () => {
        let exportDataList = displayInventory;

        // 如果有設定時間區間，進行過濾
        if (exportDateRange.start || exportDateRange.end) {
          exportDataList = displayInventory.filter(item => {
            if (!item.createdAt) return true; // 如果沒有時間欄位，預設保留
            const itemDate = new Date(item.createdAt);
            if (isNaN(itemDate.getTime())) return true;

            const start = exportDateRange.start ? new Date(exportDateRange.start + 'T00:00:00') : null;
            const end = exportDateRange.end ? new Date(exportDateRange.end + 'T23:59:59') : null;

            if (start && itemDate < start) return false;
            if (end && itemDate > end) return false;
            return true;
          });
        }

        if (exportDataList.length === 0) {
          showToast("在此時間區間內沒有資料可匯出", "error");
          setShowExportModal(false);
          return;
        }

        // 依照「匯入款式規範 - 工作表1.csv」的標準標題進行資料映射
        const exportData = exportDataList.flatMap(item => {
          const sizes = ['XS', 'S', 'M', 'L'];

          const processedKeywords = (item.hashtags || '')
            .split('#')
            .map(tag => tag.trim())
            .filter(tag => tag !== '')
            .join(',');

          return sizes.map(size => {
            return {
              '商品名稱(必填)': item.name || '未命名款式',
              '商品規格類型(填入規格類型名稱，多個類型用換行分隔，例：顏色。留空則自動命名為規格1、規格2...)': '尺寸',
              '商品規格名稱(填寫規格組合，多規格以/分隔，例：紅色/S。每行一個規格組合，只產生有填寫的規格)': size,
              '商品類型(若為票券商品請填T，預約商品請填B，一般商品請留空)': '',
              '商品貨號': item.id || '',
              '商品條碼(英文與數字)': '',
              '商品成本(NT.)': '',
              '商品售價(NT.)(必填)': item.price || 390,
              '商品特價(NT.)': '',
              '倉位編號': '',
              '商品庫存(必填)': item.stock?.[size] || 0,
              '安全庫存': '',
              '商品所有分類(多分類以 / 分開，子分類以 # 間隔，例： A#B#E/C#D#F，沒有則空白即可)': item.shape || '',
              '商品狀態(Y:上架/N:下架)': 'Y',
              '商品 SEO-Title': item.name || '',
              '商品 SEO-Description': item.description || '',
              '商品 SEO-Keywords': processedKeywords,
              '商品描述': item.description || '',
              '常見問題': '',
              '商品備註': '',
              '是否為預購商品(Y:是/N:否)': 'N',
              '商品預購提示(適用於[是否為預購商品]填入Y之商品)': '',
              '商品摘要': '',
              '商品副標題': '',
              '商品圖片(填入圖片網址，多張圖片以,分開，系統會自動下載，支援JPG/PNG/GIF/WebP格式)': '',
              '規格圖片URL(填入圖片網址，系統會自動下載並綁定到該規格，支援JPG/PNG/GIF/WebP格式)': '',
              '商品重量(公斤)': '',
              '商品長度(公分)': '',
              '商品寬度(公分)': '',
              '商品高度(公分)': '',
              '顯示主商品圖數量': '',
              '允許購買會員等級(填入等級代號，以,分開，留空表示全部會員皆可購買)': ''
            };
          });
        });

        const csv = Papa.unparse(exportData);
        const csvWithBOM = "\uFEFF" + csv;
        
        const blob = new Blob([csvWithBOM], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        
        const dateStr = new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '');
        const fileName = inventoryShapeFilter === 'All' ? `全部款式匯入表_${dateStr}.csv` : `${inventoryShapeFilter}款式匯入表_${dateStr}.csv`;
        
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        showToast(`成功匯出 ${exportDataList.length} 筆報表`, 'success');
        setShowExportModal(false);
      };

      return (
        <div className="min-h-screen bg-[#F8F9FA] pb-24 text-gray-800">
          {toastMsg && <Toast message={toastMsg.message} type={toastMsg.type} onClose={() => setToastMsg(null)} />}
          
          <header className="bg-white/95 backdrop-blur-md border-b sticky top-0 z-40 px-6 py-4 flex justify-between items-center shadow-sm">
            <div className="flex items-center gap-3">
              <span className="text-2xl bg-gray-900 text-white w-10 h-10 flex items-center justify-center rounded-xl shadow-lg">💅</span>
              <h1 className="text-lg font-black tracking-tight">雲端智能建檔系統</h1>
            </div>
            {user ? (
              <div className="flex items-center gap-4">
                <div className="hidden md:flex flex-col items-end">
                  <span className="text-[10px] font-black text-gray-400 uppercase">Administrator</span>
                  <span className="text-xs font-bold text-gray-900">{user.displayName || '使用者'}</span>
                </div>
                <button onClick={() => auth.signOut()} className="text-[10px] bg-red-50 px-4 py-2 rounded-full font-black text-red-500 hover:bg-red-500 hover:text-white transition-all">登出</button>
              </div>
            ) : (
               <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} className="text-xs bg-gray-900 text-white px-5 py-2.5 rounded-xl font-black shadow-md">Google 登入</button>
            )}
          </header>

          {!user ? (
            <div className="flex flex-col items-center justify-center pt-32 px-6">
              <div className="bg-white p-12 rounded-[3rem] shadow-2xl text-center w-full max-w-sm border border-gray-100">
                <div className="text-7xl mb-6">📂</div>
                <h2 className="text-2xl font-black mb-2 text-gray-900">歡迎進入管理系統</h2>
                <p className="text-gray-400 text-sm mb-10 font-bold">請先登入以同步雲端資料庫</p>
                <button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black shadow-xl hover:scale-105 transition-all">🌐 使用 Google 帳號登入</button>
              </div>
            </div>
          ) : (
            <main className="max-w-6xl mx-auto px-6 pt-8">
              <div className="flex gap-2 mb-6 bg-white p-1.5 rounded-2xl shadow-sm border border-gray-100 max-w-lg mx-auto">
                {['inventory', 'scan', 'upload', 'recognize'].map(tab => (
                  <button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-3 rounded-xl font-black text-xs transition-all ${activeTab === tab ? 'bg-gray-900 text-white shadow-lg' : 'text-gray-400 hover:text-gray-600'}`}>
                    {tab === 'inventory' ? '📦 款式庫' : tab === 'scan' ? '🔍 盤點' : tab === 'upload' ? '➕ 建檔' : '📷 識別款式'}
                  </button>
                ))}
              </div>

              {/* ===== 款式庫分頁 ===== */}
              {activeTab === 'inventory' && (
                <div>
                  <div className="flex items-start justify-between gap-2 mb-2">
                    <div className="flex-1 overflow-hidden w-full">
                       <ShapeFilter activeShape={inventoryShapeFilter} onShapeSelect={setInventoryShapeFilter} className="!mb-4" />
                    </div>
                    <div className="flex gap-2">
                      <button 
                        onClick={() => setBatchMode(true)} 
                        className="flex-shrink-0 bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-600 hover:text-white px-3 py-2 rounded-full font-black text-xs shadow-sm transition-all whitespace-nowrap"
                      >
                        ✏️ 批次修改
                      </button>
                      <button 
                        onClick={async () => {
                          showToast("正在更新特徵，請稍候...", "info");
                          try {
                            const batch = db.batch();
                            for (const item of inventory) {
                              if (item.media && item.media[0] && !item.features) {
                                const response = await fetch(item.media[0].url);
                                const blob = await response.blob();
                                const base64 = await new Promise(resolve => {
                                  const reader = new FileReader();
                                  reader.onload = () => resolve(reader.result);
                                  reader.readAsDataURL(blob);
                                });
                                const features = await extractImageFeatures(base64);
                                const docRef = db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory').doc(item.docId);
                                batch.update(docRef, { features });
                              }
                            }
                            await batch.commit();
                            showToast("特徵更新完成！", "success");
                          } catch (error) {
                            console.error(error);
                            showToast("更新失敗", "error");
                          }
                        }} 
                        className="flex-shrink-0 bg-purple-50 text-purple-600 border border-purple-200 hover:bg-purple-600 hover:text-white px-3 py-2 rounded-full font-black text-xs shadow-sm transition-all"
                      >
                        更新特徵
                      </button>
                      <button 
                        onClick={() => setShowExportModal(true)} 
                        className="flex-shrink-0 bg-green-50 text-green-600 border border-green-200 hover:bg-green-600 hover:text-white px-4 py-2 rounded-full font-black text-xs shadow-sm transition-all flex items-center gap-1 whitespace-nowrap"
                      >
                        <span className="text-sm">📥</span> <span className="hidden sm:inline">匯出{inventoryShapeFilter === 'All' ? '全部' : inventoryShapeFilter}報表</span>
                      </button>
                    </div>
                  </div>
                  
                  {isLoadingDB ? (
                    <div className="flex flex-col items-center py-20 animate-pulse">
                      <div className="text-4xl mb-4">⌛</div>
                      <p className="font-black text-gray-300">正在獲取雲端庫存資料...</p>
                    </div>
                  ) : batchMode ? (
                    <BatchEditor items={displayInventory} allItems={inventory} onClose={() => setBatchMode(false)} showToast={showToast} />
                  ) : (
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                      {displayInventory.map(item => (
                        <div key={item.id} onClick={() => setEditingItem(item)} className="group bg-white rounded-[2rem] overflow-hidden shadow-sm border border-gray-100 cursor-pointer hover:shadow-2xl transition-all duration-300 flex flex-col">
                          <div className="aspect-[4/5] bg-gray-50 relative overflow-hidden flex-shrink-0">
                            {item.media?.[0] ? (
                              <img src={item.media[0].url} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                            ) : (
                              <div className="w-full h-full flex items-center justify-center text-gray-300 text-[10px] font-black">無照片</div>
                            )}
                            <div className="absolute top-3 left-3 flex flex-col gap-1">
                              <span className="bg-white/90 backdrop-blur-md px-2 py-1 rounded-lg text-[9px] font-black shadow-sm">{item.id}</span>
                              {item.shape && <span className="bg-blue-600 text-white px-2 py-1 rounded-lg text-[9px] font-black shadow-sm">{item.shape}</span>}
                            </div>
                          </div>
                          <div className="p-4 flex flex-col flex-1">
                            <h3 className="font-black text-sm mb-1 line-clamp-2 leading-tight">{item.name || '未命名'}</h3>
                            <div className="mt-auto flex gap-1 pt-3">
                              {['XS', 'S', 'M', 'L'].map(s => (
                                <div key={s} className={`flex-1 text-[9px] font-black text-center py-1 rounded-md ${item.stock[s] > 0 ? 'bg-blue-50 text-blue-600' : 'bg-gray-50 text-gray-300'}`}>
                                  {s}:{item.stock[s]}
                                </div>
                              ))}
                            </div>
                          </div>
                        </div>
                      ))}
                      {displayInventory.length === 0 && !isLoadingDB && (
                        <div className="col-span-full py-32 text-center bg-white rounded-[3rem] border-2 border-dashed border-gray-100">
                          <div className="text-5xl mb-4 text-gray-200">📭</div>
                          <p className="font-black text-gray-400">此分類目前沒有款式</p>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* ===== 盤點分頁 ===== */}
              {activeTab === 'scan' && (
                <div className="max-w-2xl mx-auto space-y-4 pb-20">
                  {/* 新增系統總庫存顯示區塊 */}
                  <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                    <div className="text-sm font-black text-gray-700 flex items-center gap-2">
                      <span className="text-xl">📊</span> 系統總庫存
                    </div>
                    <div className="flex gap-3 w-full md:w-auto justify-between md:justify-end">
                      {['XS', 'S', 'M', 'L'].map(s => (

                   </div>

                   <div className="space-y-5">
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div className="md:col-span-2">
                          <label className="block text-[10px] font-black text-gray-400 mb-1">款式名稱</label>
                          <input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} className="w-full bg-gray-50 p-4 rounded-2xl font-black outline-none border border-transparent focus:border-blue-100" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-black text-gray-400 mb-1">商品價格 (NT$)</label>
                          <input type="number" value={editingItem.price || ''} onChange={e => setEditingItem({...editingItem, price: Number(e.target.value)})} className="w-full bg-gray-50 p-4 rounded-2xl font-black outline-none border border-transparent focus:border-blue-100" />
                        </div>
                      </div>
                      
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="md:col-span-2">
                          <label className="block text-[10px] font-black text-gray-400 mb-1">趨勢風格描述</label>
                          <textarea value={editingItem.description} onChange={e => setEditingItem({...editingItem, description: e.target.value})} className="w-full bg-gray-50 p-4 rounded-2xl text-xs font-bold h-24 outline-none resize-none" />
                        </div>
                        <div>
                          <label className="block text-[10px] font-black text-gray-400 mb-1">甲型</label>
                          <select value={editingItem.shape} onChange={e => setEditingItem({...editingItem, shape: e.target.value})} className="w-full bg-blue-50 p-4 rounded-2xl text-xs font-black text-blue-700 outline-none">
                            <option value="">選擇甲型</option>
                            {NAIL_SHAPES.map(s => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-[10px] font-black text-gray-400 mb-1">熱搜標籤 (#)</label>
                          <input type="text" value={editingItem.hashtags} onChange={e => setEditingItem({...editingItem, hashtags: e.target.value})} className="w-full bg-gray-50 p-4 rounded-2xl text-xs font-black outline-none" />
                        </div>
                      </div>
                   </div>

                   <div className="bg-gray-50 p-6 rounded-[2rem] space-y-4">
                      <label className="block text-[10px] font-black text-gray-400 uppercase tracking-widest">目前庫存 (直接修改)</label>
                      <div className="grid grid-cols-4 gap-4">
                         {['XS', 'S', 'M', 'L'].map(s => (
                           <div key={s} className="bg-white p-3 rounded-2xl text-center shadow-sm border border-gray-100">
                             <div className="text-[10px] font-black text-gray-300 mb-1">{s}</div>
                             <input type="number" value={editingItem.stock[s]} onChange={e => setEditingItem({...editingItem, stock: {...editingItem.stock, [s]: parseInt(e.target.value) || 0}})} className="w-full text-center bg-transparent font-black text-gray-900 outline-none" />
                           </div>
                         ))}
                      </div>
                   </div>

                   <div className="flex gap-4 pt-4">
                      <button onClick={async () => { if(confirm('確定要永久刪除此款式嗎？')) { await db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory').doc(editingItem.id).delete(); setEditingItem(null); showToast('已成功刪除'); } }} className="flex-1 bg-red-50 text-red-500 py-4 rounded-2xl font-black text-sm hover:bg-red-500 hover:text-white transition-all">🗑️ 刪除</button>
                      <button onClick={async () => { await db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory').doc(editingItem.id).update(editingItem); setEditingItem(null); showToast('已儲存變更'); }} className="flex-[2] bg-gray-900 text-white py-4 rounded-2xl font-black shadow-2xl hover:bg-black transition-all active:scale-95">💾 儲存並關閉</button>
                   </div>
                </div>
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-gray-100 flex justify-around items-center h-20 md:hidden px-4 z-40 pb-safe shadow-2xl">
             <button onClick={() => setActiveTab('inventory')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'inventory' ? 'text-gray-900' : 'text-gray-300'}`}>
                <span className="text-2xl">📦</span><span className="text-[9px] font-black">款式庫</span>
             </button>
             <button onClick={() => setActiveTab('scan')} className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'scan' ? 'text-gray-900' : 'text-gray-300'}`}>
                <span className="text-2xl">🔍</span><span className="text-[9px] font-black">盤點</span>
             </button>
             <button onClick={() => setActiveTab('upload')} className={`w-14 h-14 rounded-full flex items-center justify-center text-2xl -top-6 relative shadow-2xl transition-all ${activeTab === 'upload' ? 'bg-blue-600 text-white rotate-45' : 'bg-gray-900 text-white'}`}>+</button>
             <button onClick={() => showToast('分析報表功能開發中', 'info')} className="flex flex-col items-center gap-1 text-gray-300">
                <span className="text-2xl">📊</span><span className="text-[9px] font-black">報表</span>
             </button>
             <button onClick={() => setActiveTab('inventory')} className="flex flex-col items-center gap-1 text-gray-300">
                <span className="text-2xl">👤</span><span className="text-[9px] font-black">我的</span>
             </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <style>
    @keyframes scale-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-scale-in { animation: scale-in 0.3s ease-out forwards; }
    @keyframes bounce-short { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }
    .animate-bounce-short { animation: bounce-short 0.5s ease-out; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</body>
</html>
