<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>指尖造藝 - 專屬穿戴甲</title>
  
  <!-- Tailwind & React & Babel -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  
  <!-- Firebase (新增 Auth 模組) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#FAF9F8] text-gray-800 font-sans">
  
  <div id="root">
    <style>
      .preloader { position: fixed; inset: 0; background-color: #FAF9F8; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
      .preloader-spinner { width: 50px; height: 50px; border: 4px solid rgba(236, 72, 153, 0.1); border-left-color: #ec4899; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .preloader-text { margin-top: 16px; color: #9ca3af; font-family: sans-serif; font-weight: bold; font-size: 14px; letter-spacing: 2px; }
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* 確保 Navbar 和 分類條的吸頂效果順暢 */
      html { scroll-behavior: smooth; }
    </style>
    <div class="preloader">
      <div class="preloader-spinner"></div>
      <div class="preloader-text">載入中...</div>
    </div>
  </div>

  <script type="text/babel">
    // Firebase 初始化
    const firebaseConfig = {
      apiKey: "AIzaSyDQZGeeubB8bEUL59v9yt0QBAfIWJcvgnw",
      authDomain: "nailproject-40022.firebaseapp.com",
      projectId: "nailproject-40022",
      storageBucket: "nailproject-40022.firebasestorage.app",
      messagingSenderId: "1004628981925",
      appId: "1:1004628981925:web:db01ede0c09f4071d5754c"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    // Admin ID (您的庫存來源)
    const adminUserId = "MvkJo5e1kEcBS0fGGMr4RKdQjYg1"; 
    const appId = 'nail-inventory-app';

    const SHIPPING_FEE = 60;              
    const FREE_SHIPPING_THRESHOLD = 1000; 
    
    const PROMO_CODES = {
      'VIP9': { type: 'percent', value: 0.9, name: 'VIP 專屬 9 折' },
      'SAVE100': { type: 'minus', value: 100, name: '滿額現折 100 元' },
      'NEWOPEN': { type: 'percent', value: 0.85, name: '歡慶開幕 85 折' }
    };

    const ORDER_STATUS_LABELS = {
      pending: '⏳ 待付款', awaiting_payment: '🏧 待繳費', paid: '✅ 已付款', shipping: '📦 準備出貨',
      shipped: '🚚 已出貨', completed: '🎀 已完成', cancelled: '已取消', payment_failed: '付款未成功', amount_mismatch: '處理中'
    };

    const NAIL_SHAPES = ['全部', '短橢圓', '中橢圓', '長橢圓', '細狗尖', '杏仁甲', '短圓', '新中方', '短梯', '中梯', '長梯', '超長梯', '長水滴'];

    const { useState, useEffect, useMemo } = React;

    // --- 商品卡片元件 ---
    const ProductCard = ({ product, addToCart }) => {
      const [isHovered, setIsHovered] = useState(false);
      const [mediaIndex, setMediaIndex] = useState(0);

      useEffect(() => {
        let interval;
        if (isHovered && product.media && product.media.length > 1) {
          interval = setInterval(() => {
            setMediaIndex(prev => (prev + 1) % product.media.length);
          }, 1200);
        } else {
          setMediaIndex(0);
        }
        return () => clearInterval(interval);
      }, [isHovered, product.media]);

      const currentMedia = product.media?.[mediaIndex];

      return (
        <div 
          className="group bg-white p-3 rounded-3xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-50 flex flex-col h-full animate-fade-in-up"
          onMouseEnter={() => setIsHovered(true)}
          onMouseLeave={() => setIsHovered(false)}
        >
          <div className="aspect-[4/5] rounded-2xl overflow-hidden bg-gray-50 mb-4 relative flex-shrink-0">
            {currentMedia ? (
              currentMedia.type === 'video' ? (
                 <video src={currentMedia.url} className={`w-full h-full object-cover transition-transform duration-700 ${isHovered ? 'scale-110' : 'scale-100'}`} autoPlay muted loop playsInline />
              ) : (
                 <img src={currentMedia.url} className={`w-full h-full object-cover transition-transform duration-700 ${isHovered ? 'scale-110' : 'scale-100'}`} />
              )
            ) : (
               <div className="w-full h-full flex items-center justify-center text-gray-300">無圖片</div>
            )}
            {product.shape && <span className="absolute top-3 left-3 bg-white/95 backdrop-blur-sm text-xs font-bold px-2 py-1 rounded-lg shadow-sm text-pink-600">{product.shape}</span>}
          </div>
          
          <div className="px-1 flex-1 flex flex-col">
            <h3 className="font-black text-gray-900 text-lg mb-1 truncate">{product.name}</h3>
            {product.description && <p className="text-gray-500 text-xs mb-3 line-clamp-2 leading-relaxed">{product.description}</p>}
            
            <div className="mt-auto">
              <p className="text-pink-600 font-bold text-sm mb-3">NT$ {product.price}</p>
              <div className="flex gap-2">
                {['XS', 'S', 'M', 'L'].map(size => {
                  const inStock = product.stock[size] > 0;
                  return (
                    <button 
                      key={size} disabled={!inStock} onClick={() => addToCart(product, size)}
                      className={`flex-1 py-2 text-xs font-bold rounded-xl border transition-all active:scale-95 ${
                        inStock ? 'border-gray-200 text-gray-700 hover:border-pink-500 hover:bg-pink-50 hover:text-pink-600' : 'border-gray-100 text-gray-300 bg-gray-50 cursor-not-allowed'
                      }`}
                    >
                      {size} {inStock ? '' : <span className="block text-[8px] font-normal">售完</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- 主程式 ---
    function Shop() {
      // 狀態管理
      const [products, setProducts] = useState([]);
      const [visibleCount, setVisibleCount] = useState(8); 
      const [selectedShape, setSelectedShape] = useState('全部');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [isLoading, setIsLoading] = useState(true);
      const [isCheckingOut, setIsCheckingOut] = useState(false);
      
      // 會員與視窗狀態
      const [user, setUser] = useState(null);
      const [viewMode, setViewMode] = useState('shop'); // 'shop' | 'orders'
      const [userOrders, setUserOrders] = useState([]);
      const [showScrollTop, setShowScrollTop] = useState(false);

      // 結帳表單
      const [promoInput, setPromoInput] = useState('');
      const [appliedPromo, setAppliedPromo] = useState(null);
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [shippingAddress, setShippingAddress] = useState('');
      const [selectedStore, setSelectedStore] = useState(null); // 綠界電子地圖選到的門市
      const [isGuideOpen, setIsGuideOpen] = useState(false);

      // 1. 監聽 Firebase 登入狀態
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          if (currentUser) {
            // 若已登入，可預填姓名 (依據 Google 帳號)
            if(!customerName) setCustomerName(currentUser.displayName || '');
            fetchUserOrders(currentUser.uid);
          }
        });
        return () => unsubscribe();
      }, []);

      // 2. 獲取您的商品庫存
      useEffect(() => {
        if(!adminUserId) return;
        const inventoryRef = db.collection('artifacts').doc(appId).collection('users').doc(adminUserId).collection('inventory');
        const unsubscribe = inventoryRef.onSnapshot((snapshot) => {
          const dbData = snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id }));
          dbData.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          setProducts(dbData.filter(p => p.status !== 'N')); // 後台下架的款式不顯示
          setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // 3. 監聽捲動事件 (回到頂部按鈕)
      useEffect(() => {
        const handleScroll = () => setShowScrollTop(window.scrollY > 400);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // 綠界地圖回傳處理
      useEffect(() => {
        const handleMessage = (event) => {
          if (event.origin !== window.location.origin) return;
          if (event.data && event.data.type === 'ECPAY_MAP_RESULT') {
            setSelectedStore({ id: event.data.storeId, name: event.data.storeName, address: event.data.storeAddress, subType: event.data.subType });
            setShippingAddress(`[超商] ${event.data.storeName} (${event.data.storeAddress})`);
          }
        };
        window.addEventListener('message', handleMessage);
        return () => window.removeEventListener('message', handleMessage);
      }, []);

      // 從綠界付款頁回來（/api/ecpay_result 導回 ?order=...）
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const result = params.get('order');
        if (!result) return;
        alert(result === 'success'
          ? `付款成功！訂單編號 ${params.get('no') || ''}，我們會盡快為您出貨。`
          : `訂單 ${params.get('no') || ''} 已建立。若選擇 ATM 或超商代碼，請依綠界提供的繳費資訊在期限內完成付款。`);
        setViewMode('orders');
        window.history.replaceState(null, '', window.location.pathname);
      }, []);

      const openStoreMap = (type) => {
        window.open(`/api/ecpay_map?type=${type}`, 'ecpayMap', 'width=1000,height=700');
      };

      // 會員登入/登出
      const handleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          await auth.signInWithPopup(provider);
        } catch (error) {
          console.error("Login failed", error);
        }
      };

      const handleLogout = () => {
        auth.signOut();
        setViewMode('shop');
      };

      // 獲取會員歷史訂單
      const fetchUserOrders = (uid) => {
        db.collection('artifacts').doc(appId).collection('users').doc(uid).collection('orders')
          .orderBy('createdAt', 'desc').limit(20)
          .onSnapshot(snapshot => {
            const orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setUserOrders(orders);
          });
      };

      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      // 過濾商品邏輯
      const filteredProducts = useMemo(() => {
        if (selectedShape === '全部') return products;
        return products.filter(p => p.shape === selectedShape);
      }, [products, selectedShape]);

      const handleShapeChange = (shape) => {
        setSelectedShape(shape);
        setVisibleCount(8);
        window.scrollTo({ top: 0, behavior: 'smooth' }); // 切換分類時平滑回到最上
      };

      const addToCart = (product, size) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id && item.size === size);
          if (existing) {
            return prev.map(item => item === existing ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { ...product, size, quantity: 1 }];
        });
        setIsCartOpen(true);
      };

      const removeFromCart = (index) => setCart(prev => prev.filter((_, i) => i !== index));

      // 價格計算邏輯
      const cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      let allPrices = [];
      cart.forEach(item => { for(let i=0; i<item.quantity; i++) allPrices.push(item.price); });
      allPrices.sort((a, b) => b - a); 
      
      const bundleCount = Math.floor(allPrices.length / 4);
      let eventDiscountAmount = 0;
      let isEventFreeShipping = false;
      
      if (bundleCount > 0) {
        let originalBundlePrice = 0;
        for(let i=0; i < bundleCount * 4; i++) { originalBundlePrice += allPrices[i]; }
        eventDiscountAmount = originalBundlePrice - (bundleCount * 1000);
        isEventFreeShipping = true;
      }

      const currentShippingFee = (cartSubtotal === 0 || isEventFreeShipping || cartSubtotal >= FREE_SHIPPING_THRESHOLD) ? 0 : SHIPPING_FEE;
      const isFreeShipping = currentShippingFee === 0 && cartSubtotal > 0;
      
      let promoDiscountAmount = 0;
      const subtotalAfterEvent = cartSubtotal - eventDiscountAmount; 

      if (appliedPromo && subtotalAfterEvent > 0) {
        if (appliedPromo.type === 'percent') { promoDiscountAmount = Math.round(subtotalAfterEvent * (1 - appliedPromo.value)); } 
        else if (appliedPromo.type === 'minus') { promoDiscountAmount = appliedPromo.value; }
      }
      if (subtotalAfterEvent - promoDiscountAmount < 0) promoDiscountAmount = subtotalAfterEvent;

      const finalTotal = cartSubtotal - eventDiscountAmount - promoDiscountAmount + currentShippingFee;

      const handleApplyPromo = () => {
        const code = promoInput.toUpperCase().trim();
        if (PROMO_CODES[code]) {
          setAppliedPromo({ ...PROMO_CODES[code], code });
          setPromoInput('');
        } else {
          alert('❌ 無效的優惠碼或已過期');
        }
      };

      // 結帳：只送出商品編號、尺寸、數量，金額由伺服器依資料庫價格重新計算並建立訂單
      const handleCheckout = async () => {
        if (!customerName || !customerPhone || !shippingAddress) {
          alert('請先填寫收件人姓名、電話，並選擇取件門市！');
          return;
        }

        setIsCheckingOut(true);
        try {
          const headers = { 'Content-Type': 'application/json' };
          if (user) headers.Authorization = `Bearer ${await user.getIdToken()}`;
          const usingStore = selectedStore && shippingAddress.startsWith('[超商]');
          const response = await fetch('/api/ecpay', {
            method: 'POST',
            headers,
            body: JSON.stringify({
              items: cart.map(i => ({ id: i.docId || i.id, size: i.size, quantity: i.quantity })),
              promoCode: appliedPromo?.code || '',
              name: customerName,
              phone: customerPhone,
              store: usingStore ? selectedStore : null,
              address: usingStore ? '' : shippingAddress,
            })
          });

          if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(err.error || '結帳連線失敗，請稍後再試');
          }
          const html = await response.text();
          document.open(); document.write(html); document.close();
        } catch (e) {
          console.error(e);
          alert(e.message);
          setIsCheckingOut(false);
        }
      };

      return (
        <div className="min-h-screen relative pb-20">
          <div className="bg-[#e8dad2] text-gray-800 text-[11px] md:text-xs py-1.5 px-5 flex justify-center font-bold tracking-widest uppercase relative z-50">
             聯絡我們 : viola.lomography@gmail.com
          </div>

          {/* Header */}
          <header className="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-gray-100 shadow-sm">
            <div className="max-w-6xl mx-auto px-4 md:px-5 py-3 md:py-4 flex justify-between items-center">
              
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setViewMode('shop')}>
                {/* 加上 onError 備用圖片機制 */}
                <img 
                  src="freepik__logo__19488.png" 
                  onError={(e) => { e.target.onerror = null; e.target.src = 'https://ui-avatars.com/api/?name=指尖造藝&background=FDF2F8&color=DB2777&rounded=true&bold=true'; }}
                  alt="指尖造藝 Logo" 
                  className="w-10 h-10 md:w-12 md:h-12 rounded-full object-cover shadow-sm border border-pink-100 bg-white" 
                />
                <h1 className="text-xl md:text-2xl font-black tracking-widest text-gray-900 hidden sm:block">指尖造藝</h1>
              </div>

              <div className="flex items-center gap-2 md:gap-4">
                <button onClick={() => setIsGuideOpen(true)} className="text-xs md:text-sm font-bold text-gray-500 hover:text-pink-500 bg-gray-50 px-3 py-2 rounded-full shadow-sm border border-gray-100 transition">
                  📏 教學
                </button>

                {/* 會員登入/選單區 */}
                {user ? (
                  <div className="relative group">
                    <button className="flex items-center gap-2 bg-gray-50 hover:bg-gray-100 px-3 py-1.5 rounded-full transition border border-gray-100">
                      <img src={user.photoURL || 'https://ui-avatars.com/api/?name=U'} className="w-7 h-7 rounded-full" />
                      <span className="text-sm font-bold text-gray-700 hidden md:inline">{user.displayName?.split(' ')[0] || '會員'}</span>
                    </button>
                    {/* Hover 選單 */}
                    <div className="absolute right-0 mt-2 w-32 bg-white rounded-xl shadow-xl border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 py-2">
                      <button onClick={() => setViewMode('orders')} className="w-full text-left px-4 py-2 text-sm font-bold text-gray-700 hover:text-pink-600 hover:bg-pink-50">📋 我的訂單</button>
                      <button onClick={handleLogout} className="w-full text-left px-4 py-2 text-sm font-bold text-gray-700 hover:text-red-600 hover:bg-red-50">登出</button>
                    </div>
                  </div>
                ) : (
                  <button onClick={handleLogin} className="text-xs md:text-sm font-bold text-white bg-gray-900 px-4 py-2 rounded-full hover:bg-pink-600 transition shadow-sm">
                    登入 / 註冊
                  </button>
                )}

                <button onClick={() => setIsCartOpen(true)} className="relative p-2 flex items-center gap-2 font-bold text-gray-700 hover:text-pink-500 transition-colors bg-white rounded-full">
                  <span className="text-xl">🛒</span> 
                  {cart.length > 0 && (
                    <span className="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md animate-bounce">
                      {cart.length}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* 吸頂式甲型分類列 (僅在 Shop 模式顯示) */}
          {viewMode === 'shop' && (
            <div className="sticky top-[60px] md:top-[76px] z-30 bg-white/95 backdrop-blur-md shadow-sm border-b border-gray-100 py-3 px-4">
              <div className="max-w-6xl mx-auto overflow-x-auto hide-scrollbar">
                <div className="flex gap-2 w-max">
                  {NAIL_SHAPES.map(shape => (
                    <button
                      key={shape}
                      onClick={() => handleShapeChange(shape)}
                      className={`px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all duration-300 ${
                        selectedShape === shape
                          ? 'bg-pink-500 text-white shadow-md'
                          : 'bg-gray-50 text-gray-600 border border-gray-200 hover:bg-pink-50 hover:text-pink-500'
                      }`}
                    >
                      {shape}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          <main className="max-w-6xl mx-auto px-4 py-8">
            {viewMode === 'shop' ? (
              // --- 購物商城畫面 ---
              isLoading ? (
                 <div className="text-center py-20 text-gray-400 font-bold flex flex-col items-center gap-3">
                   <div className="w-8 h-8 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin"></div>
                   店面佈置中...
                 </div>
              ) : products.length === 0 ? (
                 <div className="text-center py-20 text-gray-500 bg-white rounded-3xl shadow-sm border border-gray-100">
                    <div className="text-6xl mb-4">🏪</div>
                    <h2 className="text-2xl font-bold mb-2">倉庫目前空空如也</h2>
                 </div>
              ) : filteredProducts.length === 0 ? (
                 <div className="text-center py-16 text-gray-500 bg-white/50 rounded-3xl border border-gray-100">
                    <div className="text-5xl mb-4">💅</div>
                    <h2 className="text-xl font-bold mb-2">此甲型目前沒有商品</h2>
                 </div>
              ) : (
                <>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8">
                    {filteredProducts.slice(0, visibleCount).map(product => (
                      <ProductCard key={product.id} product={product} addToCart={addToCart} />
                    ))}
                  </div>
                  {visibleCount < filteredProducts.length && (
                    <div className="mt-12 flex justify-center">
                      <button onClick={() => setVisibleCount(prev => prev + 8)} className="px-8 py-3 bg-white border-2 border-pink-200 text-pink-600 rounded-full font-bold hover:bg-pink-50 shadow-sm transition">
                        載入更多商品 👇
                      </button>
                    </div>
                  )}
                </>
              )
            ) : (
              // --- 我的訂單畫面 (CRM) ---
              <div className="max-w-3xl mx-auto animate-fade-in-up">
                <div className="flex items-center gap-4 mb-8">
                  <button onClick={() => setViewMode('shop')} className="text-gray-500 hover:text-gray-900 bg-white w-10 h-10 rounded-full shadow-sm flex items-center justify-center font-bold">←</button>
                  <h2 className="text-2xl font-black text-gray-900">📦 我的訂單</h2>
                </div>
                
                {userOrders.length === 0 ? (
                  <div className="bg-white p-10 rounded-3xl text-center border border-gray-100 shadow-sm">
                    <div className="text-5xl mb-4">📜</div>
                    <h3 className="text-xl font-bold text-gray-700 mb-2">您還沒有購買過任何商品</h3>
                    <button onClick={() => setViewMode('shop')} className="mt-4 text-pink-500 font-bold hover:underline">去逛逛吧！</button>
                  </div>
                ) : (
                  <div className="space-y-6">
                    {userOrders.map(order => (
                      <div key={order.id} className="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm hover:shadow-md transition">
                        <div className="flex justify-between items-center border-b border-gray-100 pb-4 mb-4">
                          <div>
                            <span className="text-xs text-gray-400 font-bold block mb-1">{new Date(order.createdAt).toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span>
                            <span className="text-sm font-bold text-gray-800 bg-gray-100 px-3 py-1 rounded-lg">單號: {order.orderId}</span>
                          </div>
                          <div className={`px-4 py-1.5 rounded-full text-sm font-bold ${
                            ['pending', 'awaiting_payment'].includes(order.status) ? 'bg-amber-100 text-amber-700' :
                            ['paid', 'shipping'].includes(order.status) ? 'bg-blue-100 text-blue-700' :
                            ['shipped', 'completed'].includes(order.status) ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'
                          }`}>
                            {ORDER_STATUS_LABELS[order.status] || order.status}
                          </div>
                        </div>
                        <div className="space-y-3 mb-4">
                          {order.items?.map((item, idx) => (
                            <div key={idx} className="flex gap-4 items-center">
                              <img src={item.image || item.media?.[0]?.url || ''} className="w-16 h-16 object-cover rounded-xl bg-gray-50" />
                              <div className="flex-1">
                                <h4 className="font-bold text-gray-900">{item.name}</h4>
                                <span className="text-xs text-gray-500 bg-gray-50 px-2 py-1 rounded-md mt-1 inline-block">尺寸: {item.size} / 數量: {item.quantity}</span>
                              </div>
                              <span className="font-bold text-pink-600">NT$ {item.price * item.quantity}</span>
                            </div>
                          ))}
                        </div>
                        {order.status === 'awaiting_payment' && order.paymentInfo && (
                          <div className="bg-amber-50 text-amber-800 rounded-xl p-4 mb-3 text-sm font-bold space-y-1">
                            {order.paymentInfo.vAccount && <div>ATM 轉帳：銀行代碼 {order.paymentInfo.bankCode}，帳號 {order.paymentInfo.vAccount}</div>}
                            {order.paymentInfo.paymentNo && <div>超商繳費代碼：{order.paymentInfo.paymentNo}</div>}
                            {order.paymentInfo.expireDate && <div>繳費期限：{order.paymentInfo.expireDate}</div>}
                          </div>
                        )}
                        <div className="bg-gray-50 rounded-xl p-4 flex justify-between items-center">
                          <div className="text-xs text-gray-500">
                            門市：{order.customerInfo?.address} <br/>
                            收件人：{order.customerInfo?.name}
                          </div>
                          <div className="text-right">
                            <span className="text-sm text-gray-500 block">總金額</span>
                            <span className="text-xl font-black text-gray-900">NT$ {order.totalAmount}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* 回到頂部按鈕 */}
          <button 
            onClick={scrollToTop}
            className={`fixed bottom-6 right-6 z-40 bg-pink-500 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center text-xl transition-all duration-300 hover:bg-pink-600 hover:scale-110 hover:shadow-pink-300/50 hover:-translate-y-1 ${showScrollTop ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}
          >
            🚀
          </button>

          {/* 教學 Modal */}
          {isGuideOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onClick={() => setIsGuideOpen(false)}></div>
              <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[85vh] overflow-y-auto relative z-10 shadow-2xl p-6 md:p-10 animate-fade-in-up">
                <button onClick={() => setIsGuideOpen(false)} className="absolute top-4 right-4 w-10 h-10 flex items-center justify-center bg-gray-100 hover:bg-gray-200 rounded-full font-bold text-gray-600 transition-colors z-20">✕</button>
                <section className="mb-10 bg-[#fbf6e9] p-6 md:p-8 rounded-3xl relative overflow-hidden border border-[#f0e8d5]">
                  <div className="absolute top-0 right-0 w-40 h-40 bg-white/60 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
                  <div className="relative z-10">
                    <p className="text-amber-700/60 font-black text-xl italic mb-1">Nail salon</p>
                    <h3 className="text-2xl font-black text-gray-800 mb-2 tracking-wide">定制款美甲</h3>
                    <div className="w-8 h-1 bg-amber-700/40 rounded-full mb-4"></div>
                    <p className="text-sm text-gray-600 mb-8 font-bold leading-loose">一副十片 每一幅甲片都是<br/>訂製款的光療美甲片哦</p>
                    <div className="flex flex-col gap-3 w-full max-w-[280px] mx-auto py-2">
                      {[
                        { num: '1/', text: '甲片打磨', color: 'bg-[#91be67]', align: 'left', rounded: 'rounded-[2rem] rounded-br-sm' },
                        { text: '吻合劑', num: '/2', color: 'bg-[#b8e1c6]', align: 'right', rounded: 'rounded-[2rem] rounded-bl-sm' },
                        { num: '3/', text: '底膠', color: 'bg-[#6c98dc]', align: 'left', rounded: 'rounded-[2rem] rounded-br-sm' },
                        { text: '多層顏色甲油膠', num: '/4', color: 'bg-[#91be67]', align: 'right', rounded: 'rounded-[2rem] rounded-bl-sm' },
                        { num: '5/', text: '飾品膠', color: 'bg-[#b8e1c6]', align: 'left', rounded: 'rounded-[2rem] rounded-br-sm' },
                        { text: '加固膠', num: '/6', color: 'bg-[#6c98dc]', align: 'right', rounded: 'rounded-[2rem] rounded-bl-sm' },
                        { num: '7/', text: '耐磨封層', color: 'bg-[#91be67]', align: 'left', rounded: 'rounded-[2rem] rounded-br-sm' },
                      ].map((step, idx) => (
                        <div key={idx} className={`flex ${step.align === 'left' ? 'justify-start' : 'justify-end'}`}>
                          <div className={`${step.color} text-white px-6 py-2.5 ${step.rounded} shadow-md flex items-center gap-2 transform transition hover:scale-105`}>
                             {step.align === 'left' ? <><span className="text-2xl font-light italic opacity-90">{step.num}</span><span className="text-lg font-bold tracking-wider">{step.text}</span></> : <><span className="text-lg font-bold tracking-wider">{step.text}</span><span className="text-2xl font-light italic opacity-90">{step.num}</span></>}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>
                <h2 className="text-2xl font-black mb-6 text-gray-900 border-b-2 border-pink-100 pb-4">📏 尺寸測量與穿戴教學</h2>
                <div className="space-y-8 text-gray-700 leading-relaxed">
                   <p className="text-sm bg-gray-50 p-4 rounded-xl border border-gray-100 mb-4">💡 準備軟尺（或一般膠帶與直尺），沿著指甲最寬處的弧度平貼測量（請勿用力下壓）。</p>
                </div>
              </div>
            </div>
          )}

          {/* 購物車 Modal */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 flex justify-end">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={() => setIsCartOpen(false)}></div>
              <div className="w-full max-w-md bg-white h-full relative flex flex-col shadow-2xl animate-fade-in-right">
                <div className="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                  <h2 className="text-xl font-black flex items-center gap-2"><span className="text-2xl">🛍️</span> 購物車清單</h2>
                  <button onClick={() => setIsCartOpen(false)} className="w-8 h-8 flex items-center justify-center bg-gray-200 hover:bg-gray-300 rounded-full transition-colors font-bold text-gray-600">✕</button>
                </div>
                
                <div className="flex-1 overflow-y-auto p-6 space-y-6">
                  {cart.length === 0 ? (
                    <div className="text-gray-400 text-center py-20 flex flex-col items-center gap-4">
                      <span className="text-6xl opacity-50">🛒</span>
                      <p className="font-bold">購物車目前是空的喔</p>
                    </div>
                  ) : (
                    cart.map((item, idx) => (
                      <div key={idx} className="flex gap-4 border-b border-gray-100 pb-6 group">
                        <img src={item.media?.[0]?.url || ''} className="w-24 h-32 object-cover rounded-2xl shadow-sm" />
                        <div className="flex-1 flex flex-col justify-between py-1">
                          <div>
                            <div className="flex justify-between items-start">
                              <h4 className="font-bold text-gray-900 text-lg leading-tight">{item.name}</h4>
                              <button onClick={() => removeFromCart(idx)} className="text-red-400 text-xs font-bold hover:text-red-600 bg-red-50 px-2 py-1 rounded-lg transition-colors">移除</button>
                            </div>
                            <span className="inline-block bg-gray-100 text-gray-600 text-xs font-bold px-2 py-1 rounded-md mt-2">尺寸：{item.size}</span>
                          </div>
                          <div className="flex justify-between items-end">
                            <span className="text-gray-500 text-sm font-bold bg-gray-50 px-3 py-1 rounded-lg">數量 x {item.quantity}</span>
                            <span className="font-black text-pink-600 text-lg">NT$ {item.price * item.quantity}</span>
                          </div>
                        </div>
                      </div>
                    ))
                  )}

                  {cart.length > 0 && (
                    <div className="bg-white border-2 border-gray-100 p-4 rounded-2xl shadow-sm mt-4">
                      <h3 className="font-bold text-gray-900 text-base mb-3 border-b pb-2">📦 取貨資訊</h3>
                      <input type="text" placeholder="真實姓名 (取貨核對用)" value={customerName} onChange={e => setCustomerName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none mb-3 bg-gray-50 focus:bg-white focus:border-pink-300 transition-colors" />
                      <input type="tel" placeholder="手機號碼" value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm outline-none mb-3 bg-gray-50 focus:bg-white focus:border-pink-300 transition-colors" />
                      <textarea placeholder="手動填寫地址或使用下方超商按鈕" value={shippingAddress} onChange={e => setShippingAddress(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-pink-200 text-sm font-bold text-pink-700 outline-none bg-pink-50 resize-none h-16 mb-2"></textarea>
                      <div className="grid grid-cols-2 gap-2">
                        <button type="button" onClick={() => openStoreMap('UNIMARTC2C')} className="py-2.5 rounded-xl border border-gray-200 text-xs font-bold text-gray-700 hover:border-pink-400 hover:text-pink-600">選擇 7-ELEVEN 門市</button>
                        <button type="button" onClick={() => openStoreMap('FAMIC2C')} className="py-2.5 rounded-xl border border-gray-200 text-xs font-bold text-gray-700 hover:border-pink-400 hover:text-pink-600">選擇全家門市</button>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-6 bg-white border-t border-gray-100 shadow-[0_-10px_20px_rgba(0,0,0,0.03)]">
                  <div className="space-y-2 mb-6 border-t border-gray-100 pt-4 text-sm font-bold text-gray-500">
                    <div className="flex justify-between"><span>商品小計</span><span>NT$ {cartSubtotal}</span></div>
                    {eventDiscountAmount > 0 && <div className="flex justify-between text-pink-500"><span>🎊 開幕活動</span><span>- NT$ {eventDiscountAmount}</span></div>}
                    <div className="flex justify-between"><span>物流運費</span>{isFreeShipping ? <span className="text-green-500">免運費</span> : <span>NT$ {currentShippingFee}</span>}</div>
                    <div className="flex justify-between items-center pt-3 border-t border-gray-100 mt-2"><span className="text-gray-900 text-base">結帳總金額</span><span className="text-3xl font-black text-pink-600">NT$ {finalTotal}</span></div>
                  </div>
                  <button 
                    disabled={cart.length === 0 || isCheckingOut} onClick={handleCheckout}
                    className="w-full bg-gray-900 text-white py-4 rounded-2xl font-black text-lg hover:bg-gray-800 disabled:bg-gray-200 disabled:text-gray-400 transition-all shadow-xl active:scale-[0.98] flex justify-center items-center gap-2"
                  >
                    {isCheckingOut ? '處理中... ⏳' : '確認結帳 💳'}
                  </button>
                </div>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{__html: ` 
            .animate-fade-in-right { animation: fadeInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; } 
            @keyframes fadeInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } } 
            .animate-fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
            @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
          `}} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Shop />);
  </script>
</body>
</html>
